name: Galaxy NR Tools public beta release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Build first public beta APK (GitHub-hosted debug signing)
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify signature and checksum
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Galaxy-NR-Tools-${GITHUB_REF_NAME}.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/Galaxy-NR-Tools-${GITHUB_REF_NAME}.apk
          cd release
          sha256sum Galaxy-NR-Tools-${GITHUB_REF_NAME}.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: galaxy-nr-tools-beta-apk
          path: release/*
          if-no-files-found: error
      - name: Publish GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --verify-tag \
            --title "Galaxy NR Tools ${GITHUB_REF_NAME}" \
            --prerelease \
            --notes-file docs/RELEASE_NOTES.md
